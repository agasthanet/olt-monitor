<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrasi — OLT MONITOR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container" style="max-width:520px;margin-top:6vh">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="mb-1"><i class="bi bi-person-vcard"></i> Lengkapi data</h5>
        <p class="small text-muted mb-3">
          Data berikut wajib diisi sebelum menggunakan aplikasi.
        </p>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="post">
          <div class="mb-2">
            <label class="form-label small">Nama lengkap</label>
            <input type="text" name="full_name" class="form-control" required
                   value="{{ profile.full_name or '' }}" placeholder="Nama Anda" autocomplete="name">
          </div>
          <div class="mb-2">
            <label class="form-label small">Perusahaan / ISP</label>
            <input type="text" name="company" class="form-control" required
                   value="{{ profile.company or '' }}" placeholder="Nama perusahaan">
          </div>
          <div class="mb-2">
            <label class="form-label small">Email</label>
            <input type="email" name="email" class="form-control" required
                   value="{{ profile.email or '' }}" placeholder="nama@domain.com" autocomplete="email">
          </div>
          <div class="mb-3">
            <label class="form-label small">No. WhatsApp</label>
            <input type="tel" name="whatsapp" class="form-control" required
                   value="{{ profile.whatsapp or '' }}" placeholder="08xxxxxxxxxx" autocomplete="tel">
          </div>
          <button type="submit" class="btn btn-primary w-100">Simpan &amp; lanjut</button>
        </form>
        <p class="small text-muted mt-3 mb-0">User: <strong>{{ username }}</strong>
          · <a href="{{ url_for('logout') }}">Logout</a></p>
      </div>
    </div>
  </div>
</body>
</html>
