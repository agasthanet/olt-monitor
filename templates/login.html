<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - OLT MONITOR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      border: none;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    .brand {
      font-weight: 700;
      letter-spacing: .02em;
    }
  </style>
</head>
<body>
  <div class="card login-card">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="mb-2 text-primary" style="font-size:2rem"><i class="bi bi-hdd-network"></i></div>
        <div class="brand fs-4">OLT MONITOR</div>
        <div class="text-muted small">Masuk untuk melanjutkan</div>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required autofocus
                 autocomplete="username" placeholder="admin">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required
                 autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
      </form>
      <p class="text-muted small text-center mt-3 mb-0">Default: <code>admin</code> / <code>admin</code></p>
    </div>
  </div>
</body>
</html>
